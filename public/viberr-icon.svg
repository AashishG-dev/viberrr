<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Vibrant violet to neon-pink gradient -->
    <linearGradient id="vibeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
  </defs>

  <!-- Dark Base / Squircle -->
  <rect width="120" height="120" rx="28" fill="#0D0D11" />

  <!-- Minimal Continuous Waveform "V" Icon -->
  <path
    d="M 28 42
       C 35 42, 42 78, 60 78
       C 78 78, 85 42, 92 42"
    fill="none"
    stroke="url(#vibeGrad)"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Subtle rhythm pulse dots -->
  <circle cx="48" cy="46" r="4" fill="#8B5CF6" opacity="0.9" />
  <circle cx="72" cy="46" r="4" fill="#EC4899" opacity="0.9" />
</svg>
